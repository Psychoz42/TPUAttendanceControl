version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: attendance_database

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2367
      POSTGRES_DB: postgres
    
    ports: 
      - "5431:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: