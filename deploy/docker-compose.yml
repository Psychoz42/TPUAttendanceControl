name: tpu-attendance

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # единственный контейнер, доступный снаружи: HTTPS и распределение запросов
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    build:
      context: ${FRONTEND_PATH:?}
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    logging: *logging

  backend:
    build:
      context: ..
    restart: unless-stopped
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      AUTH_REQUIRED: "true"
      JWT_SECRET: ${JWT_SECRET:?}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/postgres?pool_max_conns=${DB_POOL_MAX_CONNS:-20}
      PROXY_HEADER: X-Forwarded-For
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-0}
    volumes:
      - ${USERS_FILE_PATH:-./users.txt}:/app/users.txt:ro

  # накатывает новые миграции перед каждым запуском бэкенда и завершается
  migrate:
    image: migrate/migrate:v4.18.3
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgres://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/postgres?sslmode=disable
      - up
    volumes:
      - ../migrations:/migrations:ro

  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    # стандартных 64 МБ не хватает параллельным операциям на большой таблице
    shm_size: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
